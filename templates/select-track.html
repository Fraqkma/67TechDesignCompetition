<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Skill Map prototype: เลือกสายอาชีพเพื่อดูแผนผังทักษะ"
    />
    <title>Skill Map | เลือกสายอาชีพ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Anuphan:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/home.css') }}"
    />
  </head>
  <body>
    <div class="tracks-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Skill Map home">
          <span class="brand-mark" aria-hidden="true">SM</span>
          <span>
            <strong>Skill Map</strong>
            <small>Learning Roadmap Prototype</small>
          </span>
        </a>

        <div class="topbar-actions">
          <label class="topbar-search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
              <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span class="sr-only">ค้นหาสายอาชีพ</span>
            <input type="text" id="track-search" placeholder="ค้นหาสายอาชีพ..." autocomplete="off" />
          </label>
          <span class="api-status">
            <span class="status-dot"></span>
            Connected database
          </span>
        </div>
      </header>

      <main>
        <section class="tracks-hero">
          <h1>เลือกสายอาชีพที่อยากดู Skill Map</h1>
          <p>
            เลือกเส้นทางอาชีพที่คุณสนใจ เพื่อสำรวจทักษะสำคัญ
            ความเชื่อมโยงระหว่างวิชา และลำดับการเรียนรู้
            ที่ช่วยให้วางแผนพัฒนาตัวเองได้ชัดเจนขึ้น
          </p>
        </section>

        <section class="track-grid" id="track-grid">
          <p class="track-empty" id="track-loading">
            กำลังโหลดสายอาชีพจากฐานข้อมูล...
          </p>
        </section>

        <p class="track-empty hidden" id="track-empty">
          ไม่พบสายอาชีพที่ตรงกับคำค้นหา
        </p>
      </main>
    </div>

    <script>
      (function () {
        function escapeHtml(value) {
          return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        var grid = document.getElementById("track-grid");
        var loading = document.getElementById("track-loading");
        var emptyMessage = document.getElementById("track-empty");
        var searchInput = document.getElementById("track-search");
        var cards = [];

        function cardMarkup(career) {
          if (career.available) {
            return (
              '<a class="track-card active" href="/roadmap?career=' +
              encodeURIComponent(career.id) +
              '" data-track-name="' +
              escapeHtml(career.title.toLowerCase()) +
              '">' +
              '<span class="track-status available">' +
              '<span class="status-dot"></span> พร้อมใช้งาน</span>' +
              '<div class="track-icon" aria-hidden="true">' +
              escapeHtml(career.icon) +
              "</div>" +
              "<div>" +
              "<h3>" +
              escapeHtml(career.title) +
              "</h3>" +
              "<p>" +
              escapeHtml(career.description || "ยังไม่มีคำอธิบาย") +
              "</p>" +
              "</div>" +
              "</a>"
            );
          }
          return (
            '<div class="track-card locked" aria-disabled="true" data-track-name="' +
            escapeHtml(career.title.toLowerCase()) +
            '">' +
            '<span class="track-status locked">' +
            '<span class="status-dot"></span> เร็ว ๆ นี้</span>' +
            '<div class="track-icon" aria-hidden="true">' +
            escapeHtml(career.icon) +
            "</div>" +
            "<div>" +
            "<h3>" +
            escapeHtml(career.title) +
            "</h3>" +
            "<p>" +
            escapeHtml(career.description || "ยังไม่มีคำอธิบาย") +
            "</p>" +
            "</div>" +
            "</div>"
          );
        }

        function applyFilter() {
          var query = (searchInput.value || "").trim().toLowerCase();
          var visibleCount = 0;

          cards.forEach(function (card) {
            var haystack = (card.dataset.trackName || "").toLowerCase();
            var isMatch = !query || haystack.indexOf(query) !== -1;
            card.classList.toggle("hidden", !isMatch);
            if (isMatch) visibleCount += 1;
          });

          emptyMessage.classList.toggle("hidden", visibleCount !== 0);
        }

        function renderCareers(careers) {
          grid.innerHTML = careers.map(cardMarkup).join("");
          cards = Array.prototype.slice.call(
            grid.querySelectorAll(".track-card")
          );
          loading.classList.add("hidden");
          emptyMessage.classList.add("hidden");
          searchInput.disabled = false;
        }

        searchInput.addEventListener("input", applyFilter);
        searchInput.disabled = true;

        fetch("/api/careers", { credentials: "same-origin" })
          .then(function (response) {
            return response.json().catch(function () {
              return { ok: false, error: "Server did not return valid JSON" };
            });
          })
          .then(function (payload) {
            if (!payload || payload.ok === false) {
              throw new Error((payload && payload.error) || "Could not load careers");
            }
            renderCareers(payload.data || []);
          })
          .catch(function (error) {
            loading.textContent = "ไม่สามารถโหลดสายอาชีพได้: " + error.message;
            loading.classList.remove("hidden");
          });
      })();
    </script>
  </body>
</html>
