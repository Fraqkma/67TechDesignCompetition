<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skill Map | Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; font-family: Inter, "Noto Sans Thai", sans-serif; background: #061225; color: #eef5ff; }
      * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 10% 15%, #114e77 0, transparent 32rem), radial-gradient(circle at 90% 100%, #3a176c 0, transparent 35rem), #061225; }
      /* position: relative (not the blur) so .page-topbar::before can anchor to it; the blur itself
         lives on ::before rather than directly on .page-topbar so this element does not establish a
         CSS containing block for position:fixed descendants (.api-status is fixed to the viewport's
         bottom-right corner — backdrop-filter/filter/transform on an ancestor would trap it instead). */
      .page-topbar { position: relative; margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); padding: 0 28px; min-height: 80px; border-bottom: 1px solid #335170; }
      .page-topbar::before { content: ""; position: absolute; inset: 0; z-index: -1; background: rgba(6, 18, 37, .86); backdrop-filter: blur(18px); pointer-events: none; }
      .page-topbar-inner { width: min(860px, 100%); margin: 0 auto; min-height: 80px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .topbar-start { display: flex; align-items: center; gap: 14px; min-width: 0; }
      .back-button { padding: 0; margin: 0; }
      .brand { display: inline-flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
      .brand-mark { display: grid; flex: none; place-items: center; width: 42px; height: 42px; border-radius: 13px; border: 1px solid rgba(109, 229, 255, .5); background: rgba(109, 229, 255, .1); font: 900 13px/1 inherit; letter-spacing: .12em; }
      .brand strong, .brand small { display: block; }
      .brand strong { font-size: 16px; }
      .brand small { margin-top: 2px; font-size: 10px; color: #a9bed2; font-weight: 400; }
      .topbar-actions { display: flex; align-items: center; gap: 14px; }
      .api-status { display: flex; align-items: center; gap: 8px; color: #a9bed2; font-size: 12px; }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ffb454; box-shadow: 0 0 12px #ffb454; }
      main { width: min(100% - 40px, 620px); margin: 56px auto; padding: 40px; border: 1px solid #335170; border-radius: 24px; background: rgba(8, 24, 45, .92); box-shadow: 0 24px 80px #0008; }
      .eyebrow { color: #6de5ff; font-size: .8rem; letter-spacing: .15em; font-weight: 800; } h1 { margin: 12px 0 8px; } p { color: #a9bed2; line-height: 1.6; } label { display: block; margin: 24px 0 8px; font-weight: 700; } input { width: 100%; padding: 14px; border: 1px solid #41617c; border-radius: 12px; background: #091a2e; color: #eef5ff; font: inherit; } input:disabled { color: #a9bed2; } button { border: 0; border-radius: 12px; padding: 13px 18px; font: 700 1rem inherit; cursor: pointer; } #save { margin-top: 24px; background: linear-gradient(100deg, #54d7f2, #7b70ff); color: #071324; } #logout { background: transparent; border: 1px solid #a95364; color: #ffabb4; } #message { min-height: 1.3em; margin-top: 16px; color: #8de6b2; } #message.error { color: #ff9da2; }
      .portrait-card { display: grid; grid-template-columns: 116px minmax(0, 1fr); align-items: center; gap: 22px; margin: 26px 0 8px; padding: 18px; border: 1px solid rgba(109, 229, 255, .2); border-radius: 18px; background: rgba(7, 19, 38, .55); }
      .portrait-frame { width: 116px; height: 116px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(115,229,193,.65); background: #0b1830; box-shadow: 0 0 30px rgba(109, 229, 255, .12); }
      #profile-avatar { width: 100%; height: 100%; object-fit: cover; display: block; }
      #profile-avatar[hidden] { display: none; }
      #profile-avatar-placeholder { width: 100%; height: 100%; display: grid; place-items: center; color: #73e5c1; font-size: 2rem; background: radial-gradient(circle at 50% 38%, rgba(109, 200, 255, .24), transparent 42%), #0b1830; }
      #profile-avatar-placeholder[hidden] { display: none; }
      .portrait-label { font-size: .75rem; letter-spacing: .14em; opacity: .75; text-transform: uppercase; }
      #profile-portrait-status { margin-top: 7px; color: #c5d7e7; line-height: 1.5; }
      .answer-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
      .answer-chip { padding: 5px 9px; border-radius: 999px; background: rgba(109, 200, 255, .1); color: #a9dfff; font-size: .78rem; }
      #refresh-portrait { margin-top: 13px; padding: 9px 12px; border: 1px solid rgba(109, 229, 255, .35); background: rgba(109, 229, 255, .08); color: #75e6ff; font-size: .85rem; }
      .tier-card { display: grid; grid-template-columns: 76px minmax(0, 1fr); align-items: center; gap: 18px; margin: 18px 0 8px; padding: 18px; border: 1px solid rgba(255, 209, 102, .28); border-radius: 18px; background: linear-gradient(130deg, rgba(255, 209, 102, .09), rgba(109, 200, 255, .05)); }
      .tier-emblem { width: 76px; height: 76px; display: grid; place-items: center; overflow: hidden; border: 1px solid rgba(255, 209, 102, .42); border-radius: 18px; background: rgba(7, 19, 38, .75); color: #ffd166; font-size: 2rem; }
      #highest-tier-image { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
      #highest-tier-image[hidden], #highest-tier-fallback[hidden] { display: none; }
      #highest-tier-name { display: block; margin-top: 5px; color: #fff1bd; font-size: 1.35rem; }
      #highest-tier-career { display: inline-block; margin-top: 5px; color: #75e6ff; }
      #highest-tier-progress { display: block; margin-top: 6px; color: #a9bed2; }
      @media (max-width: 520px) { .portrait-card { grid-template-columns: 1fr; } .portrait-frame { width: 104px; height: 104px; } }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cosmic-theme.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/topbar-nav.css') }}" />
  </head>
  <body>
    <canvas id="cosmic-starfield-bg" aria-hidden="true"></canvas>
    <header class="page-topbar">
      <div class="page-topbar-inner">
        <div class="topbar-start">
          <button class="back-button" type="button" aria-label="ย้อนกลับ">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <a class="brand" href="/">
            <span class="brand-mark">EC</span>
            <span>
              <strong>Enlightenment Compass</strong>
              <small>Learning Skill Tree</small>
            </span>
          </a>
        </div>
        <div class="topbar-actions">
          <span class="topbar-user" id="topbar-user" hidden>
            <a class="profile-chip" href="/profile">
              <img class="avatar-icon profile-avatar-image" id="user-profile-image" alt="" hidden />
              <span class="user-name" id="user-display-name"></span>
            </a>
          </span>
          <span class="api-status">
            <span class="status-dot"></span>
            Local prototype
          </span>
          <button id="logout" type="button">Logout</button>
        </div>
      </div>
    </header>
    <main>
      <div class="eyebrow">LEARNER PROFILE</div>
      <h1>โปรไฟล์ของฉัน</h1>
      <p>ตั้งชื่อที่ใช้แสดงใน Skill Map ได้ที่นี่</p>
      <div class="portrait-card">
        <div class="portrait-frame">
          <img id="profile-avatar" alt="รูปโปรไฟล์ที่สร้างจากคำตอบของผู้เรียน" hidden />
          <div id="profile-avatar-placeholder" aria-hidden="true">✦</div>
        </div>
        <div>
          <div class="portrait-label">AI Portrait</div>
          <div id="profile-portrait-status">กำลังโหลดรูปโปรไฟล์...</div>
          <div class="answer-chips" aria-label="คำตอบสำหรับสร้างรูปโปรไฟล์">
            <span class="answer-chip" id="answer-animal"></span>
            <span class="answer-chip" id="answer-color"></span>
            <span class="answer-chip" id="answer-gender"></span>
          </div>
          <button id="refresh-portrait" type="button" hidden>สร้างรูปโปรไฟล์ด้วย AI</button>
        </div>
      </div>
      <section class="tier-card" aria-labelledby="highest-tier-label">
        <div class="tier-emblem" aria-hidden="true">
          <img id="highest-tier-image" alt="" hidden />
          <span id="highest-tier-fallback">🏆</span>
        </div>
        <div>
          <div class="portrait-label" id="highest-tier-label">Highest Career Tier</div>
          <strong id="highest-tier-name">กำลังโหลด...</strong>
          <a id="highest-tier-career" href="/roadmap">Career</a>
          <small id="highest-tier-progress"></small>
        </div>
      </section>
      <form id="profile-form">
        <label for="email">Email</label><input id="email" type="email" disabled />
        <label for="display-name">Display name</label><input id="display-name" type="text" maxlength="80" required />
        <button id="save" type="submit">บันทึกการเปลี่ยนแปลง</button>
        <div id="message" role="status"></div>
      </form>
    </main>
    <script src="{{ url_for('static', filename='js/starfield.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/topbar-user.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/back-button.js') }}" defer></script>
    <script>
      const message = document.querySelector('#message');
      const show = (text, isError = false) => { message.textContent = text; message.classList.toggle('error', isError); };
      async function requestJson(url, options = {}) {
        const response = await fetch(url, { credentials: 'same-origin', headers: {'Content-Type': 'application/json'}, ...options });
        const body = await response.json().catch(() => ({}));
        if (!response.ok || !body.ok) throw new Error(body.error || 'Request failed');
        return body;
      }
      async function loadProfile() {
        try {
          const user = (await requestJson('/api/me')).data;
          document.querySelector('#email').value = user.email;
          document.querySelector('#display-name').value = user.displayName || '';
          const avatar = document.querySelector('#profile-avatar');
          const placeholder = document.querySelector('#profile-avatar-placeholder');
          const portraitStatus = document.querySelector('#profile-portrait-status');
          const refreshButton = document.querySelector('#refresh-portrait');
          const answers = [user.favoriteAnimal, user.favoriteColor, user.gender];
          const answersComplete = answers.every((value) => typeof value === 'string' && value.trim());
          if (user.profileImage && user.profileImageGenerated) {
            // Per-account cache key: the URL is shared by every account, so the
            // user id must bust the browser cache or another account's cached
            // portrait could be shown here.
            avatar.src = '/api/profile/avatar?u=' + encodeURIComponent(user.id);
            avatar.hidden = false;
            placeholder.hidden = true;
            portraitStatus.textContent = 'สร้างจากคำตอบ 3 ข้อหลังเข้าสู่ระบบ และโหลดจากฐานข้อมูลแล้ว';
            refreshButton.hidden = true;
          } else {
            avatar.removeAttribute('src');
            avatar.hidden = true;
            placeholder.hidden = false;
            portraitStatus.textContent = answersComplete
              ? 'ยังไม่มีรูป AI ที่สร้างสำเร็จ กดปุ่มด้านล่างเพื่อลองสร้างอีกครั้ง'
              : 'กรุณาตอบคำถาม 3 ข้อในขั้นตอนสร้างโปรไฟล์ก่อน';
            refreshButton.hidden = !answersComplete;
          }
          document.querySelector('#answer-animal').textContent = `สัตว์: ${user.favoriteAnimal || '—'}`;
          document.querySelector('#answer-color').textContent = `สี: ${user.favoriteColor || '—'}`;
          document.querySelector('#answer-gender').textContent = `เพศ: ${user.gender || '—'}`;
        }
        catch (_) { window.location.assign('/login'); }
      }
      async function loadHighestCareerTier() {
        const name = document.querySelector('#highest-tier-name');
        const career = document.querySelector('#highest-tier-career');
        const progress = document.querySelector('#highest-tier-progress');
        const image = document.querySelector('#highest-tier-image');
        const fallback = document.querySelector('#highest-tier-fallback');
        try {
          const highest = (await requestJson('/api/profile/highest-achievement')).data;
          if (!highest) {
            name.textContent = 'ยังไม่มี Career Tier';
            career.textContent = 'เริ่ม Career เพื่อรับ Achievement';
            career.href = '/select-track';
            progress.textContent = '';
            return;
          }
          name.textContent = highest.achievement.name;
          career.textContent = `Career: ${highest.career.title}`;
          career.href = `/roadmap?career=${encodeURIComponent(highest.career.id)}`;
          progress.textContent = `${highest.progress}% career progress · Tier unlocks at ${highest.achievement.target}%`;
          const iconUrl = highest.achievement.iconUrl || (
            highest.achievement.name === 'God' ? '/pignopic/god.png' : ''
          );
          if (iconUrl) {
            image.src = iconUrl;
            image.hidden = false;
            fallback.hidden = true;
            image.onerror = () => {
              image.hidden = true;
              fallback.hidden = false;
            };
          }
        } catch (_) {
          name.textContent = 'โหลด Career Tier ไม่สำเร็จ';
          career.textContent = 'กลับไปที่ Roadmap';
          progress.textContent = '';
        }
      }
      document.querySelector('#refresh-portrait').addEventListener('click', async () => {
        const button = document.querySelector('#refresh-portrait');
        const portraitStatus = document.querySelector('#profile-portrait-status');
        button.disabled = true;
        portraitStatus.textContent = 'กำลังใช้คำตอบของคุณสร้างรูปโปรไฟล์ อาจใช้เวลาสักครู่...';
        show('');
        try {
          await requestJson('/api/profile/refresh', { method: 'POST' });
          await loadProfile();
          show('สร้างและบันทึกรูปโปรไฟล์ลงฐานข้อมูลแล้ว');
        } catch (error) {
          portraitStatus.textContent = 'สร้างรูปยังไม่สำเร็จ คุณสามารถลองอีกครั้งได้';
          show(error.message, true);
        } finally {
          button.disabled = false;
        }
      });
      document.querySelector('#profile-form').addEventListener('submit', async (event) => {
        event.preventDefault(); const button = document.querySelector('#save'); button.disabled = true; show('');
        try { const data = await requestJson('/api/profile', { method: 'PUT', body: JSON.stringify({displayName: document.querySelector('#display-name').value.trim()}) }); document.querySelector('#display-name').value = data.data.displayName; show('บันทึกแล้ว'); }
        catch (error) { show(error.message, true); } finally { button.disabled = false; }
      });
      document.querySelector('#logout').addEventListener('click', async () => { try { await requestJson('/api/logout', {method: 'POST'}); } finally { window.location.assign('/login'); } });
      loadProfile();
      loadHighestCareerTier();
    </script>
  </body>
</html>
