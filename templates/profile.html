<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skill Map | Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; font-family: Inter, "Noto Sans Thai", sans-serif; background: #061225; color: #eef5ff; }
      * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 10% 15%, #114e77 0, transparent 32rem), radial-gradient(circle at 90% 100%, #3a176c 0, transparent 35rem), #061225; }
      /* position: relative (not the blur) so .page-topbar::before can anchor to it; the blur itself
         lives on ::before rather than directly on .page-topbar so this element does not establish a
         CSS containing block for position:fixed descendants (.api-status is fixed to the viewport's
         bottom-right corner — backdrop-filter/filter/transform on an ancestor would trap it instead). */
      .page-topbar { position: relative; margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); padding: 0 28px; min-height: 80px; border-bottom: 1px solid #335170; }
      .page-topbar::before { content: ""; position: absolute; inset: 0; z-index: -1; background: rgba(6, 18, 37, .86); backdrop-filter: blur(18px); pointer-events: none; }
      .page-topbar-inner { width: min(860px, 100%); margin: 0 auto; min-height: 80px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .topbar-start { display: flex; align-items: center; gap: 14px; min-width: 0; }
      .brand { display: inline-flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
      .brand-mark { display: grid; flex: none; place-items: center; width: 42px; height: 42px; border-radius: 13px; border: 1px solid rgba(109, 229, 255, .5); background: rgba(109, 229, 255, .1); font: 900 13px/1 inherit; letter-spacing: .12em; }
      .brand strong, .brand small { display: block; }
      .brand strong { font-size: 16px; }
      .brand small { margin-top: 2px; font-size: 10px; color: #a9bed2; font-weight: 400; }
      .topbar-actions { display: flex; align-items: center; gap: 14px; }
      .api-status { display: flex; align-items: center; gap: 8px; color: #a9bed2; font-size: 12px; }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ffb454; box-shadow: 0 0 12px #ffb454; }
      main { width: min(100% - 40px, 620px); margin: 56px auto; padding: 40px; border: 1px solid #335170; border-radius: 24px; background: rgba(8, 24, 45, .92); box-shadow: 0 24px 80px #0008; }
      .eyebrow { color: #6de5ff; font-size: .8rem; letter-spacing: .15em; font-weight: 800; } h1 { margin: 12px 0 8px; } p { color: #a9bed2; line-height: 1.6; } label { display: block; margin: 24px 0 8px; font-weight: 700; } input { width: 100%; padding: 14px; border: 1px solid #41617c; border-radius: 12px; background: #091a2e; color: #eef5ff; font: inherit; } input:disabled { color: #a9bed2; } button { border: 0; border-radius: 12px; padding: 13px 18px; font: 700 1rem inherit; cursor: pointer; } #save { margin-top: 24px; background: linear-gradient(100deg, #54d7f2, #7b70ff); color: #071324; } #logout { background: transparent; border: 1px solid #a95364; color: #ffabb4; } #message { min-height: 1.3em; margin-top: 16px; color: #8de6b2; } #message.error { color: #ff9da2; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cosmic-theme.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/topbar-nav.css') }}" />
  </head>
  <body>
    <canvas id="cosmic-starfield-bg" aria-hidden="true"></canvas>
    <header class="page-topbar">
      <div class="page-topbar-inner">
        <div class="topbar-start">
          <button class="back-button" type="button" aria-label="ย้อนกลับ">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <a class="brand" href="/">
            <span class="brand-mark">EC</span>
            <span>
              <strong>Enlightenment Compass</strong>
              <small>Learning Skill Tree</small>
            </span>
          </a>
        </div>
        <div class="topbar-actions">
          <span class="topbar-user" id="topbar-user" hidden>
            <a class="profile-chip" href="/profile">
              <svg class="avatar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" />
                <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
              <span class="user-name" id="user-display-name"></span>
            </a>
          </span>
          <span class="api-status">
            <span class="status-dot"></span>
            Local prototype
          </span>
          <button id="logout" type="button">Logout</button>
        </div>
      </div>
    </header>
    <main>
      <div class="eyebrow">LEARNER PROFILE</div>
      <h1>โปรไฟล์ของฉัน</h1>
      <p>ตั้งชื่อที่ใช้แสดงใน Skill Map ได้ที่นี่</p>
      <form id="profile-form">
        <label for="email">Email</label><input id="email" type="email" disabled />
        <label for="display-name">Display name</label><input id="display-name" type="text" maxlength="80" required />
        <button id="save" type="submit">บันทึกการเปลี่ยนแปลง</button>
        <div id="message" role="status"></div>
      </form>
    </main>
    <script src="{{ url_for('static', filename='js/starfield.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/topbar-user.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/back-button.js') }}" defer></script>
    <script>
      const message = document.querySelector('#message');
      const show = (text, isError = false) => { message.textContent = text; message.classList.toggle('error', isError); };
      async function requestJson(url, options = {}) {
        const response = await fetch(url, { credentials: 'same-origin', headers: {'Content-Type': 'application/json'}, ...options });
        const body = await response.json().catch(() => ({}));
        if (!response.ok || !body.ok) throw new Error(body.error || 'Request failed');
        return body;
      }
      async function loadProfile() {
        try { const user = (await requestJson('/api/me')).data; document.querySelector('#email').value = user.email; document.querySelector('#display-name').value = user.displayName || ''; }
        catch (_) { window.location.assign('/login'); }
      }
      document.querySelector('#profile-form').addEventListener('submit', async (event) => {
        event.preventDefault(); const button = document.querySelector('#save'); button.disabled = true; show('');
        try { const data = await requestJson('/api/profile', { method: 'PUT', body: JSON.stringify({displayName: document.querySelector('#display-name').value.trim()}) }); document.querySelector('#display-name').value = data.data.displayName; show('บันทึกแล้ว'); }
        catch (error) { show(error.message, true); } finally { button.disabled = false; }
      });
      document.querySelector('#logout').addEventListener('click', async () => { try { await requestJson('/api/logout', {method: 'POST'}); } finally { window.location.assign('/login'); } });
      loadProfile();
    </script>
  </body>
</html>
