<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skill Map | Create account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; font-family: Inter, "Noto Sans Thai", sans-serif; background: #061225; color: #eef5ff; }
      * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 10% 15%, #114e77 0, transparent 32rem), radial-gradient(circle at 90% 100%, #3a176c 0, transparent 35rem), #061225; }
      main { width: min(100%, 440px); padding: 42px; border: 1px solid #335170; border-radius: 24px; background: rgba(8, 24, 45, .92); box-shadow: 0 24px 80px #0008; }
      .page-topbar { justify-self: stretch; margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); margin-bottom: 20px; padding: 16px 28px; display: flex; align-items: center; border-bottom: 1px solid #335170; background: rgba(6, 18, 37, .86); backdrop-filter: blur(18px); }
      .page-topbar-inner { width: min(440px, 100%); margin: 0 auto; }
      .back-button { width: 42px; padding: 0; margin: 0; }
      .brand { display: inline-flex; align-items: center; gap: 12px; color: #6de5ff; text-decoration: none; }
      .brand-mark { display: grid; flex: none; place-items: center; width: 42px; height: 42px; border-radius: 13px; border: 1px solid rgba(109, 229, 255, .5); background: rgba(109, 229, 255, .1); font: 900 13px/1 inherit; letter-spacing: .12em; }
      .brand strong, .brand small { display: block; }
      .brand strong { font-size: 16px; letter-spacing: -.02em; }
      .brand small { margin-top: 2px; font-size: 10px; color: #a9bed2; letter-spacing: normal; font-weight: 400; }
      h1 { font-size: 2rem; margin: 12px 0 8px; } p { color: #a9bed2; margin: 0 0 30px; line-height: 1.6; }
      label { display: block; margin: 18px 0 8px; font-size: .9rem; font-weight: 700; } input { width: 100%; border: 1px solid #41617c; border-radius: 12px; padding: 14px; background: #091a2e; color: inherit; font: inherit; } input:focus { outline: 2px solid #51c8e8; border-color: transparent; }
      button { width: 100%; margin-top: 26px; border: 0; border-radius: 12px; padding: 14px; background: linear-gradient(100deg, #54d7f2, #7b70ff); color: #071324; font: 800 1rem inherit; cursor: pointer; } button:disabled { opacity: .6; cursor: wait; }
      #error { min-height: 1.3em; color: #ff9da2; margin-top: 16px; } footer { margin-top: 26px; color: #a9bed2; text-align: center; } a { color: #75e6ff; font-weight: 700; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cosmic-theme.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/topbar-nav.css') }}" />
  </head>
  <body>
    <canvas id="cosmic-starfield-bg" aria-hidden="true"></canvas>
    <header class="page-topbar">
      <div class="page-topbar-inner">
        <div class="topbar-start">
          <button class="back-button" type="button" aria-label="ย้อนกลับ">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <a class="brand" href="/">
            <span class="brand-mark">EC</span>
            <span>
              <strong>Enlightenment Compass</strong>
              <small>Learning Skill Tree</small>
            </span>
          </a>
        </div>
      </div>
    </header>
    <main>
      <h1>สร้างบัญชีผู้เรียน</h1>
      <p>บันทึกความคืบหน้าของคุณแยกตามบัญชี และเรียนต่อจาก Roadmap ของตัวเอง</p>
      <form id="register-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="อย่างน้อย 8 ตัวอักษร" required />
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" type="password" autocomplete="new-password" required />
        <div id="error" role="alert"></div>
        <button id="submit" type="submit">สร้างบัญชี</button>
      </form>
      <footer>มีบัญชีอยู่แล้ว? <a href="/login">เข้าสู่ระบบ</a></footer>
    </main>
    <script src="{{ url_for('static', filename='js/starfield.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/back-button.js') }}" defer></script>
    <script>
      const form = document.querySelector('#register-form');
      const error = document.querySelector('#error');
      const submit = document.querySelector('#submit');
      form.addEventListener('submit', async (event) => {
        event.preventDefault(); error.textContent = '';
        const email = document.querySelector('#email').value.trim();
        const password = document.querySelector('#password').value;
        if (password !== document.querySelector('#confirm-password').value) { error.textContent = 'Passwords do not match'; return; }
        submit.disabled = true;
        try {
          const response = await fetch('/api/register', { method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'same-origin', body: JSON.stringify({email, password}) });
          const result = await response.json();
          if (!response.ok || !result.ok) throw new Error(result.error || 'Could not create account');
          window.location.assign(result.data?.redirect || '/login');
        } catch (err) { error.textContent = err.message; }
        finally { submit.disabled = false; }
      });
    </script>
  </body>
</html>
